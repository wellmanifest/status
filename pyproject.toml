[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.wellmanifest]
standard = "0.20.162"
revision = "8e6b51dc91a2ac7e1e771908e0fac5e12da0b9a0"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
pythonpath = [".", "standard"]
testpaths = ["tests", "standard"]
